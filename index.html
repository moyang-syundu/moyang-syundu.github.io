<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>掌事通APP - 协议文档</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #333; line-height: 1.8;
    display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 48px 56px;
    box-shadow: 0 4px 24px rgba(0,0,0,.06); text-align: center; max-width: 420px;
  }
  .logo {
    width: 64px; height: 64px; border-radius: 16px; background: #2f6fed; color: #fff;
    font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #888; font-size: 13px; margin: 0 0 24px; }
  a.btn {
    display: block; text-decoration: none; color: #2f6fed; font-size: 15px;
    padding: 12px; border: 1px solid #d8e0f5; border-radius: 8px; margin-bottom: 10px;
    transition: background .2s;
  }
  a.btn:hover { background: #f0f4ff; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">掌</div>
  <h1>掌事通APP</h1>
  <p class="sub">官方协议文档</p>
  <a class="btn" href="privacy-policy.html">隐私政策</a>
  <a class="btn" href="user-agreement.html">用户协议</a>
</div>
</body>
</html>
